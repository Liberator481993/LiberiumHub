[package]
name = "supreme-trade-core"
version = "0.2.0"
edition = "2021"
description = "Rust scraper, normalization and valuation core for the MM2 Supreme Trade Checker"
license = "MIT"

[dependencies]
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
