name: v92 source validation

on:
  push:
    branches:
      - v92/pulsehub-port
    paths:
      - "Keyless"
      - "src/**"
      - "tools/**"
      - ".github/workflows/v92-source-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Liberium Hub
        uses: actions/checkout@v4

      - name: Build the official Luau compiler
        shell: bash
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau.git "$RUNNER_TEMP/luau"
          cmake -S "$RUNNER_TEMP/luau" -B "$RUNNER_TEMP/luau-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUAU_BUILD_TESTS=OFF \
            -DLUAU_BUILD_CLI=ON
          cmake --build "$RUNNER_TEMP/luau-build" \
            --target Luau.Compile.CLI \
            --parallel 2

      - name: Verify the builder and generated output
        shell: bash
        run: |
          python -m py_compile tools/build_keyless.py
          python tools/build_keyless.py --output "$RUNNER_TEMP/Keyless.bundle"
          python - <<'PY'
          from pathlib import Path
          import os

          tracked = Path("Keyless").read_bytes()
          generated = Path(os.environ["RUNNER_TEMP"], "Keyless.bundle").read_bytes()
          if tracked != generated:
              print(f"Tracked bytes: {len(tracked)}; generated bytes: {len(generated)}")
              for offset, (left, right) in enumerate(zip(tracked, generated)):
                  if left != right:
                      start = max(0, offset - 32)
                      end = offset + 64
                      print(f"First mismatch at byte {offset}")
                      print("Tracked:  ", repr(tracked[start:end]))
                      print("Generated:", repr(generated[start:end]))
                      break
              raise SystemExit("Keyless bundle is not reproducible")
          print(f"Keyless bundle matches exactly ({len(tracked)} bytes)") 
          PY

      - name: Compile all v92 Luau sources
        shell: bash
        run: |
          compiler="$RUNNER_TEMP/luau-build/luau-compile"
          "$compiler" src/core/Maid.lua >/dev/null
          "$compiler" src/ui/Theme.lua >/dev/null
          "$compiler" src/ui/Window.lua >/dev/null
          "$compiler" src/ui/LegacyAdapter.lua >/dev/null
          "$compiler" src/features/Movement/MovementPlus.lua >/dev/null
          "$compiler" src/features/ESP/ESPManager.lua >/dev/null
          "$compiler" src/legacy/Keyless.base.lua >/dev/null
          "$compiler" Keyless >/dev/null

      - name: Check whitespace errors
        run: git diff --check
